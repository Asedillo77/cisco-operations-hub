[project]
name = "cisco-network-health-monitor-demo"
version = "0.1.0"
description = "A dry-run-first Cisco switch and edge-router health reporting demo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dante Rivera" }]
dependencies = ["jinja2>=3.1,<4", "netmiko>=4.6,<5"]

[project.scripts]
cisco-network-health = "daily_network_health_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_network_health_monitor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
